<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="errShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Where Do Wrong-Part Errors Actually Come From?</text>
  <text x="600" y="58" text-anchor="middle" fill="#64748b" font-size="13">Error rate by stage in the order fulfillment process</text>

  <!-- Order flow process bar -->
  <rect x="60" y="82" width="1080" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="100" y="113" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.5">ORDER FLOW:</text>

  <!-- Process steps in flow bar -->
  <g transform="translate(210, 92)">
    <rect x="0" y="0" width="130" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="65" y="21" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Customer Request</text>

    <text x="142" y="21" fill="#cbd5e1" font-size="14">&#x2192;</text>

    <rect x="158" y="0" width="120" height="32" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="218" y="21" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Interpretation</text>

    <text x="290" y="21" fill="#cbd5e1" font-size="14">&#x2192;</text>

    <rect x="306" y="0" width="90" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="351" y="21" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Lookup</text>

    <text x="408" y="21" fill="#cbd5e1" font-size="14">&#x2192;</text>

    <rect x="424" y="0" width="90" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="469" y="21" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Selection</text>

    <text x="526" y="21" fill="#cbd5e1" font-size="14">&#x2192;</text>

    <rect x="542" y="0" width="90" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="587" y="21" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Picking</text>

    <text x="644" y="21" fill="#cbd5e1" font-size="14">&#x2192;</text>

    <rect x="660" y="0" width="90" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="705" y="21" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Shipping</text>
  </g>

  <!-- Bar chart area -->
  <!-- Y-axis -->
  <text x="68" y="168" fill="#94a3b8" font-size="10">50%</text>
  <line x1="96" y1="165" x2="1120" y2="165" stroke="#f1f5f9" stroke-width="1"/>
  <text x="68" y="218" fill="#94a3b8" font-size="10">40%</text>
  <line x1="96" y1="215" x2="1120" y2="215" stroke="#f1f5f9" stroke-width="1"/>
  <text x="68" y="268" fill="#94a3b8" font-size="10">30%</text>
  <line x1="96" y1="265" x2="1120" y2="265" stroke="#f1f5f9" stroke-width="1"/>
  <text x="68" y="318" fill="#94a3b8" font-size="10">20%</text>
  <line x1="96" y1="315" x2="1120" y2="315" stroke="#f1f5f9" stroke-width="1"/>
  <text x="68" y="368" fill="#94a3b8" font-size="10">10%</text>
  <line x1="96" y1="365" x2="1120" y2="365" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Baseline -->
  <line x1="96" y1="415" x2="1120" y2="415" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="75" y="418" fill="#94a3b8" font-size="10">0%</text>

  <!-- Bar 1: Customer Request - 40% -->
  <g filter="url(#errShadow)">
    <rect x="148" y="215" width="100" height="200" rx="6" fill="#fecaca"/>
    <rect x="148" y="215" width="100" height="30" rx="6" fill="#ef4444"/>
    <text x="198" y="236" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">40%</text>
  </g>
  <text x="198" y="438" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Customer</text>
  <text x="198" y="452" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Request</text>

  <!-- Bar 2: Interpretation - 25% (TALLEST prominence marker) -->
  <g filter="url(#errShadow)">
    <rect x="318" y="290" width="100" height="125" rx="6" fill="#fca5a5"/>
    <rect x="318" y="290" width="100" height="30" rx="6" fill="#dc2626"/>
    <text x="368" y="311" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">25%</text>
  </g>
  <text x="368" y="438" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">Interpretation</text>
  <text x="368" y="452" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">(biggest gap)</text>

  <!-- Bar 3: Lookup - 15% -->
  <g filter="url(#errShadow)">
    <rect x="488" y="340" width="100" height="75" rx="6" fill="#fed7aa"/>
    <rect x="488" y="340" width="100" height="26" rx="6" fill="#f97316"/>
    <text x="538" y="359" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">15%</text>
  </g>
  <text x="538" y="438" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Lookup</text>

  <!-- Bar 4: Selection - 10% -->
  <g filter="url(#errShadow)">
    <rect x="658" y="365" width="100" height="50" rx="6" fill="#fde68a"/>
    <rect x="658" y="365" width="100" height="24" rx="6" fill="#f59e0b"/>
    <text x="708" y="384" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">10%</text>
  </g>
  <text x="708" y="438" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Selection</text>

  <!-- Bar 5: Picking - 7% -->
  <g filter="url(#errShadow)">
    <rect x="828" y="380" width="100" height="35" rx="6" fill="#e2e8f0"/>
    <rect x="828" y="380" width="100" height="22" rx="6" fill="#94a3b8"/>
    <text x="878" y="397" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">7%</text>
  </g>
  <text x="878" y="438" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Picking</text>

  <!-- Bar 6: Shipping - 3% -->
  <g filter="url(#errShadow)">
    <rect x="998" y="400" width="100" height="15" rx="6" fill="#cbd5e1"/>
    <text x="1048" y="397" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="800">3%</text>
  </g>
  <text x="1048" y="438" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Shipping</text>

  <!-- AI coverage bracket -->
  <rect x="120" y="462" width="528" height="30" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <line x1="148" y1="458" x2="148" y2="462" stroke="#10b981" stroke-width="1.5"/>
  <line x1="618" y1="458" x2="618" y2="462" stroke="#10b981" stroke-width="1.5"/>
  <text x="384" y="482" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="700">AI addresses 75% of errors at the source</text>

  <!-- Annotation arrow to interpretation bar -->
  <line x1="368" y1="275" x2="368" y2="255" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="288" y="152" width="160" height="24" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="368" y="168" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="600">Where AI has biggest impact</text>
</svg>