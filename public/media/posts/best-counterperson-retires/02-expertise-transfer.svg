<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Knowledge Transfer: Before and After AI</text>
  <text x="600" y="58" text-anchor="middle" fill="#475569" font-size="13">How AI transforms single-point-of-failure expertise into distributed knowledge</text>

  <!-- Divider line down center -->
  <line x1="600" y1="75" x2="600" y2="440" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Arrow between states -->
  <rect x="567" y="235" width="66" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="255" text-anchor="middle" fill="#64748b" font-size="16" font-weight="700">&#x2192;</text>

  <!-- ===== LEFT SIDE: BEFORE ===== -->
  <rect x="40" y="70" width="520" height="370" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="70" width="520" height="4" rx="2" fill="#f59e0b" opacity="0.6"/>

  <text x="300" y="100" text-anchor="middle" fill="#92400e" font-size="16" font-weight="700">BEFORE</text>
  <text x="300" y="118" text-anchor="middle" fill="#64748b" font-size="11">Knowledge trapped in one person</text>

  <!-- Large expert figure in center-left with knowledge aura -->
  <g transform="translate(300, 255)">
    <!-- Glowing aura rings -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>
    <!-- Person icon -->
    <circle cx="0" cy="-15" r="18" fill="#f59e0b" opacity="0.6"/>
    <rect x="-15" y="8" width="30" height="22" rx="8" fill="#f59e0b" opacity="0.6"/>
    <!-- Star badge -->
    <text x="0" y="-8" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">&#x2605;</text>
    <text x="0" y="50" text-anchor="middle" fill="#92400e" font-size="10" font-weight="700">EXPERT</text>
    <text x="0" y="63" text-anchor="middle" fill="#b45309" font-size="9">30 yrs experience</text>
  </g>

  <!-- Surrounding dim employees (no aura) -->
  <g opacity="0.5">
    <!-- Top left -->
    <g transform="translate(140, 180)">
      <circle cx="0" cy="0" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-4" r="6" fill="#94a3b8"/>
      <rect x="-5" y="4" width="10" height="8" rx="3" fill="#94a3b8"/>
      <text x="0" y="32" text-anchor="middle" fill="#94a3b8" font-size="8">New hire</text>
    </g>
    <!-- Top right -->
    <g transform="translate(460, 180)">
      <circle cx="0" cy="0" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-4" r="6" fill="#94a3b8"/>
      <rect x="-5" y="4" width="10" height="8" rx="3" fill="#94a3b8"/>
      <text x="0" y="32" text-anchor="middle" fill="#94a3b8" font-size="8">Jr. staff</text>
    </g>
    <!-- Bottom left -->
    <g transform="translate(140, 340)">
      <circle cx="0" cy="0" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-4" r="6" fill="#94a3b8"/>
      <rect x="-5" y="4" width="10" height="8" rx="3" fill="#94a3b8"/>
      <text x="0" y="32" text-anchor="middle" fill="#94a3b8" font-size="8">Counter 2</text>
    </g>
    <!-- Bottom right -->
    <g transform="translate(460, 340)">
      <circle cx="0" cy="0" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="-4" r="6" fill="#94a3b8"/>
      <rect x="-5" y="4" width="10" height="8" rx="3" fill="#94a3b8"/>
      <text x="0" y="32" text-anchor="middle" fill="#94a3b8" font-size="8">Sales rep</text>
    </g>
  </g>

  <!-- Dashed dependency lines from dim employees to expert -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3" opacity="0.4">
    <line x1="160" y1="195" x2="270" y2="235"/>
    <line x1="440" y1="195" x2="330" y2="235"/>
    <line x1="160" y1="325" x2="270" y2="275"/>
    <line x1="440" y1="325" x2="330" y2="275"/>
  </g>

  <!-- ===== RIGHT SIDE: AFTER ===== -->
  <rect x="640" y="70" width="520" height="370" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="640" y="70" width="520" height="4" rx="2" fill="#3b82f6" opacity="0.6"/>

  <text x="900" y="100" text-anchor="middle" fill="#1e40af" font-size="16" font-weight="700">AFTER</text>
  <text x="900" y="118" text-anchor="middle" fill="#64748b" font-size="11">Knowledge distributed through AI</text>

  <!-- Central AI hub -->
  <g transform="translate(900, 255)">
    <!-- Radiating knowledge rings -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <!-- AI icon -->
    <rect x="-18" y="-22" width="36" height="36" rx="8" fill="#3b82f6" opacity="0.8"/>
    <text x="0" y="-2" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800">AI</text>
    <text x="0" y="36" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="700">KNOWLEDGE</text>
    <text x="0" y="48" text-anchor="middle" fill="#1e40af" font-size="9" font-weight="700">HUB</text>
  </g>

  <!-- Connected, glowing employees (all with aura now) -->
  <!-- Top left -->
  <g transform="translate(740, 180)">
    <circle cx="0" cy="0" r="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="0" cy="-4" r="6" fill="#3b82f6" opacity="0.6"/>
    <rect x="-5" y="4" width="10" height="8" rx="3" fill="#3b82f6" opacity="0.6"/>
    <text x="0" y="35" text-anchor="middle" fill="#1e40af" font-size="8" font-weight="600">New hire</text>
  </g>
  <!-- Top right -->
  <g transform="translate(1060, 180)">
    <circle cx="0" cy="0" r="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="0" cy="-4" r="6" fill="#3b82f6" opacity="0.6"/>
    <rect x="-5" y="4" width="10" height="8" rx="3" fill="#3b82f6" opacity="0.6"/>
    <text x="0" y="35" text-anchor="middle" fill="#1e40af" font-size="8" font-weight="600">Jr. staff</text>
  </g>
  <!-- Bottom left -->
  <g transform="translate(740, 340)">
    <circle cx="0" cy="0" r="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="0" cy="-4" r="6" fill="#3b82f6" opacity="0.6"/>
    <rect x="-5" y="4" width="10" height="8" rx="3" fill="#3b82f6" opacity="0.6"/>
    <text x="0" y="35" text-anchor="middle" fill="#1e40af" font-size="8" font-weight="600">Counter 2</text>
  </g>
  <!-- Bottom right -->
  <g transform="translate(1060, 340)">
    <circle cx="0" cy="0" r="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="0" cy="-4" r="6" fill="#3b82f6" opacity="0.6"/>
    <rect x="-5" y="4" width="10" height="8" rx="3" fill="#3b82f6" opacity="0.6"/>
    <text x="0" y="35" text-anchor="middle" fill="#1e40af" font-size="8" font-weight="600">Sales rep</text>
  </g>

  <!-- Solid connection lines from AI to all employees -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.35">
    <line x1="765" y1="195" x2="865" y2="235"/>
    <line x1="1035" y1="195" x2="935" y2="235"/>
    <line x1="765" y1="325" x2="865" y2="275"/>
    <line x1="1035" y1="325" x2="935" y2="275"/>
  </g>

  <!-- Bottom insight -->
  <rect x="150" y="455" width="900" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="477" text-anchor="middle" fill="#475569" font-size="12" font-weight="600">AI transforms <tspan fill="#f59e0b">single-point expertise</tspan> into <tspan fill="#3b82f6">organization-wide knowledge</tspan></text>
</svg>