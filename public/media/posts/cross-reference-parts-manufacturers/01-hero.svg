<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Cross-Reference Network: One Part, Many Manufacturers</text>
  <text x="600" y="58" text-anchor="middle" fill="#475569" font-size="13">How a single product maps across manufacturer catalogs</text>

  <!-- Center node -->
  <g transform="translate(600, 250)">
    <circle cx="0" cy="0" r="70" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="0" cy="0" r="55" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-12" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="700">1/2" Ball Valve</text>
    <text x="0" y="6" text-anchor="middle" fill="#8b5cf6" font-size="11">Lead-Free, SWT</text>
    <text x="0" y="24" text-anchor="middle" fill="#8b5cf6" font-size="10">600 WOG</text>
  </g>

  <!-- Connecting lines (behind nodes) -->
  <g stroke="#8b5cf6" stroke-width="2.5" opacity="0.25">
    <line x1="530" y1="225" x2="310" y2="140"/>
    <line x1="530" y1="275" x2="310" y2="360"/>
    <line x1="670" y1="225" x2="890" y2="140"/>
    <line x1="670" y1="275" x2="890" y2="360"/>
  </g>
  <!-- Decorative dots on lines -->
  <circle cx="430" cy="180" r="3.5" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="430" cy="315" r="3.5" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="770" cy="180" r="3.5" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="770" cy="315" r="3.5" fill="#8b5cf6" opacity="0.3"/>

  <!-- Manufacturer node 1: Watts (top-left, blue accent) -->
  <g transform="translate(210, 130)">
    <rect x="-100" y="-40" width="200" height="80" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="-100" y="-40" width="200" height="5" rx="3" fill="#3b82f6"/>
    <text x="0" y="-12" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="700">Watts</text>
    <rect x="-70" y="-2" width="140" height="24" rx="6" fill="#dbeafe"/>
    <text x="0" y="15" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="600">LFFBV-3C</text>
    <text x="0" y="32" text-anchor="middle" fill="#64748b" font-size="9">Lead-free brass, 1/2"</text>
  </g>

  <!-- Manufacturer node 2: NIBCO (bottom-left, green accent) -->
  <g transform="translate(210, 360)">
    <rect x="-100" y="-40" width="200" height="80" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="-100" y="-40" width="200" height="5" rx="3" fill="#10b981"/>
    <text x="0" y="-12" text-anchor="middle" fill="#065f46" font-size="14" font-weight="700">NIBCO</text>
    <rect x="-70" y="-2" width="140" height="24" rx="6" fill="#d1fae5"/>
    <text x="0" y="15" text-anchor="middle" fill="#065f46" font-size="12" font-weight="600">T-FP600A</text>
    <text x="0" y="32" text-anchor="middle" fill="#64748b" font-size="9">Full port, SWT x SWT</text>
  </g>

  <!-- Manufacturer node 3: Apollo (top-right, amber accent) -->
  <g transform="translate(990, 130)">
    <rect x="-100" y="-40" width="200" height="80" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="-100" y="-40" width="200" height="5" rx="3" fill="#f59e0b"/>
    <text x="0" y="-12" text-anchor="middle" fill="#92400e" font-size="14" font-weight="700">Apollo</text>
    <rect x="-70" y="-2" width="140" height="24" rx="6" fill="#fef3c7"/>
    <text x="0" y="15" text-anchor="middle" fill="#92400e" font-size="12" font-weight="600">94ALF-A</text>
    <text x="0" y="32" text-anchor="middle" fill="#64748b" font-size="9">94A series, LF</text>
  </g>

  <!-- Manufacturer node 4: Matco-Norca (bottom-right, rose accent) -->
  <g transform="translate(990, 360)">
    <rect x="-100" y="-40" width="200" height="80" rx="12" fill="#ffffff" stroke="#f43f5e" stroke-width="2"/>
    <rect x="-100" y="-40" width="200" height="5" rx="3" fill="#f43f5e"/>
    <text x="0" y="-12" text-anchor="middle" fill="#9f1239" font-size="14" font-weight="700">Matco-Norca</text>
    <rect x="-70" y="-2" width="140" height="24" rx="6" fill="#ffe4e6"/>
    <text x="0" y="15" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="600">759C07LF</text>
    <text x="0" y="32" text-anchor="middle" fill="#64748b" font-size="9">Lead-free, chrome plated</text>
  </g>

  <!-- Bottom insight -->
  <rect x="250" y="450" width="700" height="38" rx="19" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="600" y="474" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="600">Same function, different part numbers — knowing the cross-references is the expertise</text>
</svg>