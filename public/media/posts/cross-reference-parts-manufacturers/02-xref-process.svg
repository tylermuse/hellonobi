<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Cross-Reference Process: Manual vs. AI</text>
  <text x="600" y="58" text-anchor="middle" fill="#475569" font-size="13">Side-by-side comparison of finding equivalent parts across manufacturers</text>

  <!-- ===== LEFT PANEL: Manual ===== -->
  <rect x="40" y="75" width="530" height="400" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="40" y="75" width="530" height="4" rx="2" fill="#f59e0b" opacity="0.5"/>

  <text x="305" y="105" text-anchor="middle" fill="#92400e" font-size="16" font-weight="700">Manual Cross-Reference</text>
  <text x="305" y="122" text-anchor="middle" fill="#64748b" font-size="11">The old way: multiple steps, multiple sources</text>

  <!-- Step 1 -->
  <g transform="translate(80, 145)">
    <circle cx="16" cy="16" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">1</text>
    <rect x="44" y="0" width="420" height="50" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="62" y="20" fill="#1e293b" font-size="12" font-weight="600">Search ERP System</text>
    <text x="62" y="37" fill="#64748b" font-size="10">Look up part in your system, often no cross-ref data</text>
    <rect x="370" y="10" width="80" height="28" rx="6" fill="#fef3c7"/>
    <text x="410" y="29" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">~2 min</text>
  </g>

  <!-- Arrow -->
  <text x="96" y="215" fill="#cbd5e1" font-size="18">&#x25BC;</text>

  <!-- Step 2 -->
  <g transform="translate(80, 220)">
    <circle cx="16" cy="16" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">2</text>
    <rect x="44" y="0" width="420" height="50" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="62" y="20" fill="#1e293b" font-size="12" font-weight="600">Check Paper / PDF Catalogs</text>
    <text x="62" y="37" fill="#64748b" font-size="10">Flip through manufacturer catalogs or PDFs</text>
    <rect x="370" y="10" width="80" height="28" rx="6" fill="#fef3c7"/>
    <text x="410" y="29" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">~5 min</text>
  </g>

  <!-- Arrow -->
  <text x="96" y="290" fill="#cbd5e1" font-size="18">&#x25BC;</text>

  <!-- Step 3 -->
  <g transform="translate(80, 295)">
    <circle cx="16" cy="16" r="16" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">3</text>
    <rect x="44" y="0" width="420" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="62" y="20" fill="#1e293b" font-size="12" font-weight="600">Call Manufacturer / Rep</text>
    <text x="62" y="37" fill="#64748b" font-size="10">Phone the manufacturer for cross-ref confirmation</text>
    <rect x="370" y="10" width="80" height="28" rx="6" fill="#fecaca"/>
    <text x="410" y="29" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="700">~10 min</text>
  </g>

  <!-- Arrow -->
  <text x="96" y="365" fill="#cbd5e1" font-size="18">&#x25BC;</text>

  <!-- Step 4 -->
  <g transform="translate(80, 370)">
    <circle cx="16" cy="16" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="21" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">4</text>
    <rect x="44" y="0" width="420" height="50" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="62" y="20" fill="#1e293b" font-size="12" font-weight="600">Verify Specs Match</text>
    <text x="62" y="37" fill="#64748b" font-size="10">Double-check dimensions, materials, ratings</text>
    <rect x="370" y="10" width="80" height="28" rx="6" fill="#fef3c7"/>
    <text x="410" y="29" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="700">~3 min</text>
  </g>

  <!-- Manual total time -->
  <rect x="110" y="438" width="400" height="30" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="160" y="457" fill="#dc2626" font-size="20">&#x23F1;</text>
  <text x="310" y="458" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">Total: 15-30 minutes per lookup</text>

  <!-- ===== RIGHT PANEL: AI ===== -->
  <rect x="630" y="75" width="530" height="400" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="630" y="75" width="530" height="4" rx="2" fill="#10b981" opacity="0.5"/>

  <text x="895" y="105" text-anchor="middle" fill="#065f46" font-size="16" font-weight="700">AI Cross-Reference</text>
  <text x="895" y="122" text-anchor="middle" fill="#64748b" font-size="11">One step: type your question, get instant results</text>

  <!-- Single step box -->
  <g transform="translate(670, 155)">
    <!-- Input box -->
    <rect x="0" y="0" width="450" height="50" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="20" fill="#64748b" font-size="10">Ask:</text>
    <text x="20" y="38" fill="#1e293b" font-size="12" font-weight="600">"What's equivalent to Watts LFFBV-3C in Apollo?"</text>
  </g>

  <!-- Arrow down -->
  <text x="895" y="228" text-anchor="middle" fill="#10b981" font-size="24">&#x25BC;</text>

  <!-- Results box -->
  <g transform="translate(670, 240)">
    <rect x="0" y="0" width="450" height="180" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="225" y="24" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">INSTANT RESULTS</text>
    <line x1="20" y1="34" x2="430" y2="34" stroke="#a7f3d0" stroke-width="1"/>

    <!-- Result rows -->
    <g transform="translate(20, 50)">
      <circle cx="8" cy="4" r="5" fill="#3b82f6" opacity="0.3"/>
      <text x="20" y="8" fill="#1e293b" font-size="11" font-weight="600">Watts LFFBV-3C</text>
      <text x="240" y="8" fill="#64748b" font-size="10">(Your current part)</text>
    </g>
    <g transform="translate(20, 76)">
      <circle cx="8" cy="4" r="5" fill="#f59e0b" opacity="0.3"/>
      <text x="20" y="8" fill="#1e293b" font-size="11" font-weight="600">Apollo 94ALF-A</text>
      <text x="240" y="8" fill="#10b981" font-size="10" font-weight="600">&#x2713; Verified match</text>
    </g>
    <g transform="translate(20, 102)">
      <circle cx="8" cy="4" r="5" fill="#10b981" opacity="0.3"/>
      <text x="20" y="8" fill="#1e293b" font-size="11" font-weight="600">NIBCO T-FP600A</text>
      <text x="240" y="8" fill="#10b981" font-size="10" font-weight="600">&#x2713; Verified match</text>
    </g>
    <g transform="translate(20, 128)">
      <circle cx="8" cy="4" r="5" fill="#f43f5e" opacity="0.3"/>
      <text x="20" y="8" fill="#1e293b" font-size="11" font-weight="600">Matco-Norca 759C07LF</text>
      <text x="240" y="8" fill="#10b981" font-size="10" font-weight="600">&#x2713; Verified match</text>
    </g>
    <line x1="20" y1="146" x2="430" y2="146" stroke="#a7f3d0" stroke-width="1"/>
    <text x="225" y="166" text-anchor="middle" fill="#64748b" font-size="10">Specs, availability, and pricing included</text>
  </g>

  <!-- AI total time -->
  <rect x="700" y="438" width="390" height="30" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="750" y="457" fill="#10b981" font-size="20">&#x26A1;</text>
  <text x="895" y="458" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">Total: 10-30 seconds per lookup</text>
</svg>