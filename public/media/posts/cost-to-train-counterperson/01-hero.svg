<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Light background -->
  <rect width="1200" height="500" fill="#f1f5f9"/>

  <!-- Receipt card with shadow -->
  <rect x="350" y="20" width="500" height="460" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="352" y="22" width="500" height="460" rx="8" fill="none" stroke="#00000008" stroke-width="4"/>

  <!-- Decorative top border -->
  <rect x="350" y="20" width="500" height="6" rx="3" fill="#f59e0b"/>

  <!-- Receipt zigzag bottom -->
  <path d="M350 470 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10 l10-10 l10 10" stroke="#e2e8f0" fill="white" stroke-width="1"/>

  <!-- Header -->
  <text x="600" y="65" text-anchor="middle" font-size="13" fill="#94a3b8" font-weight="500" letter-spacing="3">TRAINING COST ESTIMATE</text>
  <line x1="400" y1="80" x2="800" y2="80" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="112" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">Cost to Train One Counterperson</text>
  <line x1="400" y1="130" x2="800" y2="130" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Column headers -->
  <text x="400" y="158" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">ITEM</text>
  <text x="800" y="158" text-anchor="end" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="1">AMOUNT</text>
  <line x1="390" y1="168" x2="810" y2="168" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Line item 1 -->
  <text x="400" y="198" font-size="16" fill="#334155" font-weight="500">Direct Onboarding</text>
  <text x="400" y="214" font-size="11" fill="#94a3b8">Materials, systems access, HR processing</text>
  <line x1="580" y1="196" x2="730" y2="196" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="800" y="198" text-anchor="end" font-size="16" fill="#334155" font-weight="600">$4,100</text>

  <!-- Line item 2 -->
  <text x="400" y="248" font-size="16" fill="#334155" font-weight="500">Supervisor Time</text>
  <text x="400" y="264" font-size="11" fill="#94a3b8">Mentoring, oversight, corrections</text>
  <line x1="560" y1="246" x2="710" y2="246" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="800" y="248" text-anchor="end" font-size="16" fill="#334155" font-weight="600">$10-19K</text>

  <!-- Line item 3 -->
  <text x="400" y="298" font-size="16" fill="#334155" font-weight="500">Reduced Productivity</text>
  <text x="400" y="314" font-size="11" fill="#94a3b8">Slower service, missed cross-sells</text>
  <line x1="590" y1="296" x2="720" y2="296" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="800" y="298" text-anchor="end" font-size="16" fill="#334155" font-weight="600">$6-12K</text>

  <!-- Line item 4 -->
  <text x="400" y="348" font-size="16" fill="#334155" font-weight="500">Error Costs</text>
  <text x="400" y="364" font-size="11" fill="#94a3b8">Wrong parts, returns, customer churn</text>
  <line x1="510" y1="346" x2="730" y2="346" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="800" y="348" text-anchor="end" font-size="16" fill="#334155" font-weight="600">$3-8K</text>

  <!-- Divider -->
  <line x1="390" y1="385" x2="810" y2="385" stroke="#f59e0b" stroke-width="3"/>

  <!-- Total -->
  <rect x="390" y="395" width="420" height="40" rx="4" fill="#fffbeb"/>
  <text x="400" y="422" font-size="16" fill="#92400e" font-weight="700">TOTAL</text>
  <text x="800" y="422" text-anchor="end" font-size="26" fill="#b45309" font-weight="800">$23–45K</text>

  <!-- Footer -->
  <text x="600" y="458" text-anchor="middle" font-size="10" fill="#94a3b8">Source: SHRM, industry estimates  |  Per employee, first 12-24 months</text>
</svg>