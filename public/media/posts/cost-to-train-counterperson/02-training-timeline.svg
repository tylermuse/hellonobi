<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">Counterperson Training Timeline</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#64748b">From hire to full competence: 12-24 months of investment</text>

  <!-- Baseline -->
  <line x1="80" y1="440" x2="1120" y2="440" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Phase 1 - Coral/Red - shortest card -->
  <rect x="100" y="320" width="220" height="120" rx="8" fill="white" stroke="#fca5a5" stroke-width="2"/>
  <rect x="100" y="320" width="220" height="8" rx="4" fill="#ef4444"/>
  <text x="210" y="348" text-anchor="middle" font-size="11" fill="#ef4444" font-weight="700" letter-spacing="1.5">PHASE 1</text>
  <text x="210" y="368" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">Supervised</text>
  <text x="210" y="386" text-anchor="middle" font-size="12" fill="#64748b">Months 1-3</text>
  <rect x="155" y="394" width="110" height="20" rx="10" fill="#fef2f2"/>
  <text x="210" y="408" text-anchor="middle" font-size="12" fill="#ef4444" font-weight="700">20% Productivity</text>
  <circle cx="120" cy="430" r="3" fill="#fca5a5"/><text x="128" y="434" font-size="9" fill="#94a3b8">Shadowing senior staff</text>
  <circle cx="120" cy="438" r="3" fill="#fca5a5"/>

  <!-- Phase 2 - Amber - taller -->
  <rect x="355" y="245" width="220" height="195" rx="8" fill="white" stroke="#fcd34d" stroke-width="2"/>
  <rect x="355" y="245" width="220" height="8" rx="4" fill="#f59e0b"/>
  <text x="465" y="275" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="700" letter-spacing="1.5">PHASE 2</text>
  <text x="465" y="295" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">Semi-Independent</text>
  <text x="465" y="313" text-anchor="middle" font-size="12" fill="#64748b">Months 4-6</text>
  <rect x="410" y="322" width="110" height="20" rx="10" fill="#fffbeb"/>
  <text x="465" y="336" text-anchor="middle" font-size="12" fill="#d97706" font-weight="700">45% Productivity</text>
  <circle cx="375" cy="358" r="3" fill="#fcd34d"/><text x="383" y="362" font-size="9" fill="#94a3b8">Handles common requests</text>
  <circle cx="375" cy="374" r="3" fill="#fcd34d"/><text x="383" y="378" font-size="9" fill="#94a3b8">Still asks many questions</text>

  <!-- Ascending arrow between 1-2 -->
  <path d="M328 380 L347 340" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
  <polygon points="345,338 352,345 340,345" fill="#e2e8f0"/>

  <!-- Phase 3 - Blue - taller still -->
  <rect x="610" y="170" width="220" height="270" rx="8" fill="white" stroke="#93c5fd" stroke-width="2"/>
  <rect x="610" y="170" width="220" height="8" rx="4" fill="#3b82f6"/>
  <text x="720" y="200" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="700" letter-spacing="1.5">PHASE 3</text>
  <text x="720" y="220" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">Growing</text>
  <text x="720" y="238" text-anchor="middle" font-size="12" fill="#64748b">Months 7-12</text>
  <rect x="665" y="247" width="110" height="20" rx="10" fill="#eff6ff"/>
  <text x="720" y="261" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">70% Productivity</text>
  <circle cx="630" cy="284" r="3" fill="#93c5fd"/><text x="638" y="288" font-size="9" fill="#94a3b8">Recognizes most applications</text>
  <circle cx="630" cy="300" r="3" fill="#93c5fd"/><text x="638" y="304" font-size="9" fill="#94a3b8">Building cross-ref knowledge</text>

  <!-- Ascending arrow between 2-3 -->
  <path d="M583 310 L602 265" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
  <polygon points="600,263 607,270 595,270" fill="#e2e8f0"/>

  <!-- Phase 4 - Green - tallest -->
  <rect x="865" y="90" width="220" height="350" rx="8" fill="white" stroke="#86efac" stroke-width="2"/>
  <rect x="865" y="90" width="220" height="8" rx="4" fill="#22c55e"/>
  <text x="975" y="120" text-anchor="middle" font-size="11" fill="#22c55e" font-weight="700" letter-spacing="1.5">PHASE 4</text>
  <text x="975" y="140" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="700">Full Competence</text>
  <text x="975" y="158" text-anchor="middle" font-size="12" fill="#64748b">Months 12-24</text>
  <rect x="920" y="167" width="110" height="20" rx="10" fill="#f0fdf4"/>
  <text x="975" y="181" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">95% Productivity</text>
  <circle cx="885" cy="204" r="3" fill="#86efac"/><text x="893" y="208" font-size="9" fill="#94a3b8">Handles edge cases confidently</text>
  <circle cx="885" cy="220" r="3" fill="#86efac"/><text x="893" y="224" font-size="9" fill="#94a3b8">Mentors newer employees</text>

  <!-- Ascending arrow between 3-4 -->
  <path d="M838 235 L857 185" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
  <polygon points="855,183 862,190 850,190" fill="#e2e8f0"/>

  <!-- Timeline arrow along bottom -->
  <line x1="100" y1="468" x2="1060" y2="468" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="1060,463 1080,468 1060,473" fill="#cbd5e1"/>
  <text x="100" y="488" font-size="11" fill="#94a3b8" font-weight="500">HIRE DATE</text>
  <text x="1080" y="488" text-anchor="end" font-size="11" fill="#94a3b8" font-weight="500">FULL COMPETENCE</text>
</svg>