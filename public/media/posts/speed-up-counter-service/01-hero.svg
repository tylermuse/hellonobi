<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">The Morning Rush: Counter Traffic Pattern</text>
  <text x="600" y="58" text-anchor="middle" fill="#475569" font-size="13">Customer volume throughout the morning at a typical distributor counter</text>

  <!-- Chart area -->
  <rect x="100" y="72" width="980" height="320" rx="0" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Y-axis label -->
  <text x="35" y="235" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600" transform="rotate(-90,35,235)">CUSTOMER VOLUME</text>

  <!-- Y-axis grid lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="100" y1="112" x2="1080" y2="112"/>
    <line x1="100" y1="152" x2="1080" y2="152"/>
    <line x1="100" y1="192" x2="1080" y2="192"/>
    <line x1="100" y1="232" x2="1080" y2="232"/>
    <line x1="100" y1="272" x2="1080" y2="272"/>
    <line x1="100" y1="312" x2="1080" y2="312"/>
    <line x1="100" y1="352" x2="1080" y2="352"/>
  </g>

  <!-- Y-axis labels -->
  <g font-size="10" fill="#94a3b8" text-anchor="end">
    <text x="92" y="76">High</text>
    <text x="92" y="236">Med</text>
    <text x="92" y="395">Low</text>
  </g>

  <!-- Area fill for the chart -->
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="peakFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Area path: 5AM(low) -> 5:30(rise) -> 6AM(steep rise) -> 6:30(peak) -> 7AM(peak) -> 7:30(decline) -> 8:30(moderate) -> 10(low) -> 11(low) -->
  <path d="M100,380 C140,375 180,365 230,340 Q280,290 330,160 Q370,95 410,85 Q450,82 490,90 Q530,100 570,140 Q620,195 680,250 Q740,290 800,310 Q870,335 940,355 Q1000,370 1050,378 L1080,380 L1080,392 L100,392 Z"
        fill="url(#areaFill)"/>

  <!-- Peak highlight zone (6-7:30 AM) -->
  <rect x="280" y="72" width="260" height="320" fill="#14b8a6" opacity="0.06"/>
  <line x1="280" y1="72" x2="280" y2="392" stroke="#14b8a6" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="540" y1="72" x2="540" y2="392" stroke="#14b8a6" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <text x="410" y="370" text-anchor="middle" fill="#14b8a6" font-size="10" font-weight="600" opacity="0.6">PEAK WINDOW</text>

  <!-- Line on top of area -->
  <path d="M100,380 C140,375 180,365 230,340 Q280,290 330,160 Q370,95 410,85 Q450,82 490,90 Q530,100 570,140 Q620,195 680,250 Q740,290 800,310 Q870,335 940,355 Q1000,370 1050,378"
        fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round"/>

  <!-- X-axis -->
  <line x1="100" y1="392" x2="1080" y2="392" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- X-axis time labels -->
  <g font-size="12" fill="#475569" font-weight="500">
    <text x="100" y="415" text-anchor="middle">5 AM</text>
    <text x="230" y="415" text-anchor="middle">5:30</text>
    <text x="360" y="415" text-anchor="middle">6:00</text>
    <text x="490" y="415" text-anchor="middle">6:30</text>
    <text x="620" y="415" text-anchor="middle">7:00</text>
    <text x="750" y="415" text-anchor="middle">8:00</text>
    <text x="880" y="415" text-anchor="middle">9:00</text>
    <text x="1010" y="415" text-anchor="middle">10:00</text>
    <text x="1075" y="415" text-anchor="middle">11</text>
  </g>

  <!-- Annotation callouts -->
  <!-- Peak callout -->
  <line x1="410" y1="85" x2="410" y2="72" stroke="#0d9488" stroke-width="1.5"/>
  <rect x="345" y="68" width="130" height="38" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="410" y="84" text-anchor="middle" fill="#0d9488" font-size="10" font-weight="700">PEAK: 6:15 AM</text>
  <text x="410" y="98" text-anchor="middle" fill="#64748b" font-size="9">Avg wait: 8-12 min</text>

  <!-- 7AM callout -->
  <rect x="565" y="108" width="120" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="625" y="122" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">7:00 AM</text>
  <text x="625" y="135" text-anchor="middle" fill="#64748b" font-size="9">Wait: 4-6 min</text>
  <line x1="600" y1="140" x2="590" y2="155" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 8AM callout -->
  <rect x="710" y="260" width="110" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="765" y="274" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">8:00 AM</text>
  <text x="765" y="287" text-anchor="middle" fill="#64748b" font-size="9">Wait: 1-2 min</text>
  <line x1="755" y1="293" x2="752" y2="308" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bottom stat bar -->
  <rect x="150" y="445" width="900" height="42" rx="21" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="600" y="462" text-anchor="middle" fill="#0d9488" font-size="13" font-weight="700">45% of daily transactions happen between 6:00 - 7:30 AM</text>
  <text x="600" y="479" text-anchor="middle" fill="#64748b" font-size="11">Every second of lookup time is multiplied during the rush</text>
</svg>