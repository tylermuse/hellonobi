<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Top accent gradient bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#blueBar)"/>

  <!-- Divider line -->
  <line x1="588" y1="40" x2="588" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>
  <circle cx="588" cy="250" r="18" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="588" y="255" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="700">→</text>

  <!-- LEFT SIDE: Chat interface -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="50" width="490" height="400" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Chat header -->
    <rect x="50" y="50" width="490" height="50" rx="16" fill="#f8fafc"/>
    <rect x="50" y="84" width="490" height="16" fill="#f8fafc"/>
    <text x="80" y="82" fill="#475569" font-size="13" font-weight="600">Customer Request</text>
    <circle cx="510" cy="75" r="5" fill="#94a3b8"/>

    <!-- Employee avatar + message -->
    <circle cx="90" cy="140" r="16" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="90" y="145" text-anchor="middle" fill="#6366f1" font-size="11" font-weight="700">CS</text>

    <rect x="116" y="120" width="360" height="72" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="132" y="143" fill="#475569" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">COUNTER STAFF</text>
    <text x="132" y="166" fill="#1e293b" font-size="15" font-weight="500">"I need the brass fitting for</text>
    <text x="132" y="184" fill="#1e293b" font-size="15" font-weight="500">the water heater"</text>

    <!-- Thinking dots -->
    <g transform="translate(116, 212)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <circle cx="22" cy="14" r="3" fill="#3b82f6" opacity="0.4"/>
      <circle cx="36" cy="14" r="3" fill="#3b82f6" opacity="0.6"/>
      <circle cx="50" cy="14" r="3" fill="#3b82f6" opacity="0.8"/>
    </g>

    <!-- Vague terms highlighted -->
    <g transform="translate(76, 270)">
      <text x="0" y="0" fill="#94a3b8" font-size="10" font-weight="500" letter-spacing="0.5">VAGUE TERMS DETECTED:</text>
      <rect x="0" y="10" width="72" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="36" y="26" text-anchor="middle" fill="#92400e" font-size="10" font-weight="500">brass fitting</text>
      <rect x="80" y="10" width="84" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="122" y="26" text-anchor="middle" fill="#92400e" font-size="10" font-weight="500">water heater</text>
      <rect x="172" y="10" width="100" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="222" y="26" text-anchor="middle" fill="#92400e" font-size="10" font-weight="500">no part number</text>
    </g>

    <!-- Bottom label -->
    <text x="295" y="430" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Everyday request at the counter</text>
  </g>

  <!-- RIGHT SIDE: AI Result Card -->
  <g filter="url(#cardShadow)">
    <rect x="636" y="50" width="520" height="400" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Result header -->
    <rect x="636" y="50" width="520" height="50" rx="16" fill="#eff6ff"/>
    <rect x="636" y="84" width="520" height="16" fill="#eff6ff"/>
    <circle cx="666" cy="75" r="10" fill="#3b82f6"/>
    <text x="666" y="79" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">✓</text>
    <text x="686" y="81" fill="#1e293b" font-size="14" font-weight="600">AI Copilot Result</text>
    <rect x="1040" y="64" width="86" height="24" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="1083" y="80" text-anchor="middle" fill="#166534" font-size="10" font-weight="600">98% match</text>

    <!-- Main product card -->
    <rect x="660" y="118" width="472" height="100" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Product image placeholder -->
    <rect x="676" y="130" width="72" height="72" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="712" y="164" text-anchor="middle" fill="#6366f1" font-size="9">PRODUCT</text>
    <text x="712" y="176" text-anchor="middle" fill="#6366f1" font-size="9">IMAGE</text>

    <text x="764" y="150" fill="#1e293b" font-size="16" font-weight="700">SharkBite 3/4" Push-to-Connect</text>
    <text x="764" y="170" fill="#475569" font-size="12">Brass Adapter for Water Heater Lines</text>

    <!-- Specs row -->
    <g transform="translate(764, 182)">
      <rect x="0" y="0" width="78" height="20" rx="4" fill="#eff6ff"/>
      <text x="39" y="14" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="500">SKU: SB-2401</text>
      <rect x="84" y="0" width="52" height="20" rx="4" fill="#f0fdf4"/>
      <text x="110" y="14" text-anchor="middle" fill="#166534" font-size="10" font-weight="500">In Stock</text>
      <rect x="142" y="0" width="56" height="20" rx="4" fill="#faf5ff"/>
      <text x="170" y="14" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="500">47 units</text>
    </g>

    <!-- Price -->
    <text x="1085" y="156" text-anchor="end" fill="#1e293b" font-size="24" font-weight="800">$12.85</text>
    <text x="1085" y="172" text-anchor="end" fill="#94a3b8" font-size="11">per unit</text>

    <!-- Separator -->
    <line x1="660" y1="236" x2="1132" y2="236" stroke="#e2e8f0" stroke-width="1"/>
    <text x="660" y="258" fill="#475569" font-size="11" font-weight="600" letter-spacing="0.5">ALTERNATIVES</text>

    <!-- Alt 1 -->
    <rect x="660" y="268" width="228" height="68" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="660" y="268" width="4" height="68" rx="2" fill="#6366f1"/>
    <text x="680" y="290" fill="#1e293b" font-size="13" font-weight="600">Watts LF4727</text>
    <text x="680" y="306" fill="#64748b" font-size="11">3/4" Brass Adapter</text>
    <text x="680" y="324" fill="#6366f1" font-size="14" font-weight="700">$11.40</text>
    <text x="850" y="324" text-anchor="end" fill="#64748b" font-size="10">32 in stock</text>

    <!-- Alt 2 -->
    <rect x="900" y="268" width="228" height="68" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="900" y="268" width="4" height="68" rx="2" fill="#3b82f6"/>
    <text x="920" y="290" fill="#1e293b" font-size="13" font-weight="600">Apollo EPXFA3412</text>
    <text x="920" y="306" fill="#64748b" font-size="11">3/4" PTC Brass Fitting</text>
    <text x="920" y="324" fill="#3b82f6" font-size="14" font-weight="700">$13.20</text>
    <text x="1090" y="324" text-anchor="end" fill="#64748b" font-size="10">18 in stock</text>

    <!-- Cross-reference note -->
    <rect x="660" y="354" width="472" height="36" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="676" y="377" fill="#166534" font-size="11" font-weight="500">✓ Cross-referenced across 3 manufacturers · 2 alternatives in stock</text>

    <!-- Bottom label -->
    <text x="896" y="430" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Instant, verified result from your catalog</text>
  </g>
</svg>