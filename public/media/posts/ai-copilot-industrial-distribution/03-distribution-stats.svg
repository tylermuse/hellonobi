<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="statShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="6" flood-color="#94a3b8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="700">The Distribution Industry at a Crossroads</text>
  <text x="600" y="74" text-anchor="middle" fill="#64748b" font-size="13">Key metrics driving the need for AI-powered tools</text>

  <!-- Row 1 -->
  <!-- Card 1: Workforce 55+ -->
  <g filter="url(#statShadow)">
    <rect x="60" y="105" width="520" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="60" y="105" width="6" height="160" rx="3" fill="#ef4444"/>

    <text x="100" y="160" fill="#ef4444" font-size="56" font-weight="800">25%</text>
    <text x="100" y="188" fill="#1e293b" font-size="16" font-weight="600">of distribution workforce is 55+</text>
    <text x="100" y="210" fill="#64748b" font-size="13">A quarter of all industry knowledge walks out the door</text>
    <text x="100" y="228" fill="#64748b" font-size="13">with every retirement wave</text>

    <!-- Mini bar chart -->
    <g transform="translate(430, 130)">
      <rect x="0" y="80" width="24" height="20" rx="3" fill="#fecaca"/>
      <rect x="30" y="60" width="24" height="40" rx="3" fill="#fca5a5"/>
      <rect x="60" y="30" width="24" height="70" rx="3" fill="#f87171"/>
      <rect x="90" y="0" width="24" height="100" rx="3" fill="#ef4444"/>
      <text x="57" y="115" text-anchor="middle" fill="#94a3b8" font-size="9">Aging trend</text>
    </g>
  </g>

  <!-- Card 2: Unfilled jobs -->
  <g filter="url(#statShadow)">
    <rect x="620" y="105" width="520" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="620" y="105" width="6" height="160" rx="3" fill="#f59e0b"/>

    <text x="660" y="160" fill="#f59e0b" font-size="56" font-weight="800">2.1M</text>
    <text x="660" y="188" fill="#1e293b" font-size="16" font-weight="600">unfilled manufacturing jobs by 2030</text>
    <text x="660" y="210" fill="#64748b" font-size="13">Deloitte/NAM study projects massive talent gap</text>
    <text x="660" y="228" fill="#64748b" font-size="13">across manufacturing and distribution</text>

    <!-- Warning indicators -->
    <g transform="translate(1000, 135)">
      <rect x="0" y="0" width="100" height="80" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="50" y="34" text-anchor="middle" fill="#d97706" font-size="28" font-weight="700">!</text>
      <text x="50" y="52" text-anchor="middle" fill="#92400e" font-size="10" font-weight="600">CRITICAL</text>
      <text x="50" y="66" text-anchor="middle" fill="#92400e" font-size="10" font-weight="600">SHORTAGE</text>
    </g>
  </g>

  <!-- Row 2 -->
  <!-- Card 3: Onboarding cost -->
  <g filter="url(#statShadow)">
    <rect x="60" y="290" width="520" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="60" y="290" width="6" height="160" rx="3" fill="#3b82f6"/>

    <text x="100" y="346" fill="#3b82f6" font-size="56" font-weight="800">$4,100</text>
    <text x="100" y="374" fill="#1e293b" font-size="16" font-weight="600">average cost to onboard one new hire</text>
    <text x="100" y="396" fill="#64748b" font-size="13">Direct costs only -- does not include the 6-12 months</text>
    <text x="100" y="414" fill="#64748b" font-size="13">of reduced productivity during ramp-up</text>

    <!-- Dollar stack -->
    <g transform="translate(448, 316)">
      <rect x="0" y="70" width="90" height="16" rx="4" fill="#dbeafe"/>
      <rect x="8" y="52" width="90" height="16" rx="4" fill="#93c5fd"/>
      <rect x="16" y="34" width="90" height="16" rx="4" fill="#60a5fa"/>
      <rect x="24" y="16" width="90" height="16" rx="4" fill="#3b82f6"/>
      <text x="55" y="105" text-anchor="middle" fill="#94a3b8" font-size="9">Cost layers</text>
    </g>
  </g>

  <!-- Card 4: AI adoption -->
  <g filter="url(#statShadow)">
    <rect x="620" y="290" width="520" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="620" y="290" width="6" height="160" rx="3" fill="#10b981"/>

    <text x="660" y="346" fill="#10b981" font-size="56" font-weight="800">83%</text>
    <text x="660" y="374" fill="#1e293b" font-size="16" font-weight="600">of distribution execs investing in AI</text>
    <text x="660" y="396" fill="#64748b" font-size="13">NAW survey shows overwhelming executive consensus</text>
    <text x="660" y="414" fill="#64748b" font-size="13">that AI is essential for competitive survival</text>

    <!-- Gauge-like indicator -->
    <g transform="translate(1020, 318)">
      <path d="M10 70 A50 50 0 1 1 90 70" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
      <path d="M10 70 A50 50 0 1 1 84 36" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
      <text x="50" y="60" text-anchor="middle" fill="#10b981" font-size="18" font-weight="800">83%</text>
      <text x="50" y="85" text-anchor="middle" fill="#94a3b8" font-size="9">Adoption</text>
    </g>
  </g>
</svg>