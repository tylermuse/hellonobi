  <circle cx="780" cy="224" r="14" fill="#dcfce7"/>
  <text x="780" y="230" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="700">&#x2713;</text>
  <circle cx="1020" cy="224" r="14" fill="#fef3c7"/>
  <text x="1020" y="230" text-anchor="middle" fill="#d97706" font-size="16" font-weight="700">~</text>

  <!-- Row 3 -->
  <rect x="60" y="252" width="1080" height="56" fill="#ffffff"/>
  <line x1="60" y1="308" x2="1140" y2="308" stroke="#f1f5f9" stroke-width="1"/>
  <text x="80" y="285" fill="#1e293b" font-size="14" font-weight="500">Cross-references manufacturers</text>
  <circle cx="530" cy="280" r="14" fill="#dcfce7"/>
  <text x="530" y="286" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="700">&#x2713;</text>
  <circle cx="780" cy="280" r="14" fill="#fef3c7"/>
