  <!-- Row 5 -->
  <rect x="60" y="364" width="1080" height="56" fill="#ffffff"/>
  <rect x="60" y="416" width="1080" height="4" rx="2" fill="#f1f5f9"/>
  <text x="80" y="397" fill="#1e293b" font-size="14" font-weight="500">Scales with headcount</text>
  <circle cx="530" cy="392" r="14" fill="#dcfce7"/>
  <text x="530" y="398" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="700">&#x2713;</text>
  <circle cx="780" cy="392" r="14" fill="#dcfce7"/>
  <text x="780" y="398" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="700">&#x2713;</text>
  <circle cx="1020" cy="392" r="14" fill="#fef2f2"/>
  <text x="1020" y="398" text-anchor="middle" fill="#dc2626" font-size="16" font-weight="700">&#x2717;</text>

  <!-- Score summary -->
  <rect x="60" y="432" width="1080" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="230" y="463" text-anchor="middle" fill="#475569" font-size="13" font-weight="600">OVERALL SCORE</text>

  <rect x="478" y="443" width="104" height="30" rx="15" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="530" y="463" text-anchor="middle" fill="#16a34a" font-size="14" font-weight="700">5 / 5</text>

  <rect x="728" y="443" width="104" height="30" rx="15" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="780" y="463" text-anchor="middle" fill="#d97706" font-size="14" font-weight="700">3 / 5</text>

  <rect x="968" y="443" width="104" height="30" rx="15" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="1020" y="463" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="700">2 / 5</text>
