  <circle cx="530" cy="336" r="14" fill="#dcfce7"/>
  <text x="530" y="342" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="700">&#x2713;</text>
  <circle cx="780" cy="336" r="14" fill="#dcfce7"/>
