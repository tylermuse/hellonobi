  <text x="1020" y="117" text-anchor="middle" fill="#475569" font-size="13" font-weight="700">TRIBAL KNOWLEDGE</text>

  <!-- Row 1 -->
  <rect x="60" y="140" width="1080" height="56" fill="#ffffff"/>
  <line x1="60" y1="196" x2="1140" y2="196" stroke="#f1f5f9" stroke-width="1"/>
  <text x="80" y="173" fill="#1e293b" font-size="14" font-weight="500">Understands vague or</text>
  <text x="80" y="189" fill="#1e293b" font-size="14" font-weight="500">colloquial requests</text>
  <circle cx="530" cy="168" r="14" fill="#dcfce7"/>
  <text x="530" y="174" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="700">&#x2713;</text>
  <circle cx="780" cy="168" r="14" fill="#fef2f2"/>
  <text x="780" y="174" text-anchor="middle" fill="#dc2626" font-size="16" font-weight="700">&#x2717;</text>
  <circle cx="1020" cy="168" r="14" fill="#dcfce7"/>
  <text x="1020" y="174" text-anchor="middle" fill="#16a34a" font-size="16" font-weight="700">&#x2713;</text>

  <!-- Row 2 -->
  <rect x="60" y="196" width="1080" height="56" fill="#f8fafc"/>
  <line x1="60" y1="252" x2="1140" y2="252" stroke="#f1f5f9" stroke-width="1"/>
  <text x="80" y="229" fill="#1e293b" font-size="14" font-weight="500">Searches full catalog</text>
  <circle cx="530" cy="224" r="14" fill="#dcfce7"/>
