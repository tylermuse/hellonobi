<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">How Does an AI Copilot Compare?</text>
  <text x="600" y="64" text-anchor="middle" fill="#64748b" font-size="13">Feature comparison across part identification methods</text>

  <!-- Table -->
  <!-- Header row -->
  <rect x="60" y="88" width="340" height="48" rx="10" fill="#f1f5f9"/>
  <text x="230" y="117" text-anchor="middle" fill="#475569" font-size="13" font-weight="700">FACTOR</text>

