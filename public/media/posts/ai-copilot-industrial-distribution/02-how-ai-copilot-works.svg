<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="stepShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#94a3b8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#1e293b" font-size="26" font-weight="700">How the AI Copilot Works</text>
  <text x="600" y="78" text-anchor="middle" fill="#64748b" font-size="14">From vague request to verified part number in seconds</text>

  <!-- Connecting line behind cards -->
  <line x1="180" y1="250" x2="1020" y2="250" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Step 1: Customer Describes -->
  <g filter="url(#stepShadow)">
    <rect x="48" y="120" width="240" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="48" y="120" width="240" height="8" rx="4" fill="#dbeafe"/>

    <!-- Number badge -->
    <circle cx="168" cy="168" r="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="168" y="175" text-anchor="middle" fill="#3b82f6" font-size="18" font-weight="800">1</text>

    <!-- Speech icon -->
    <g transform="translate(143, 202)">
      <rect x="0" y="0" width="50" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <polygon points="12,36 20,36 16,46" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="12" y1="12" x2="38" y2="12" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="20" x2="32" y2="20" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="28" x2="26" y2="28" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    </g>

    <text x="168" y="276" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="700">Customer Describes</text>
    <text x="168" y="298" text-anchor="middle" fill="#64748b" font-size="12">Uses everyday language,</text>
    <text x="168" y="314" text-anchor="middle" fill="#64748b" font-size="12">trade slang, or partial info</text>

    <rect x="72" y="332" width="192" height="28" rx="6" fill="#f1f5f9"/>
    <text x="168" y="350" text-anchor="middle" fill="#475569" font-size="11" font-style="italic">"brass thing for water heater"</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(296, 238)">
    <rect x="0" y="0" width="60" height="24" rx="12" fill="#dbeafe"/>
    <text x="30" y="17" text-anchor="middle" fill="#3b82f6" font-size="18" font-weight="700">&#x2192;</text>
  </g>

  <!-- Step 2: AI Interprets -->
  <g filter="url(#stepShadow)">
    <rect x="364" y="120" width="240" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="364" y="120" width="240" height="8" rx="4" fill="#c7d2fe"/>

    <circle cx="484" cy="168" r="22" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
    <text x="484" y="175" text-anchor="middle" fill="#7c3aed" font-size="18" font-weight="800">2</text>

    <!-- Brain icon -->
    <g transform="translate(462, 202)">
      <circle cx="22" cy="18" r="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
      <path d="M14 18 C14 12, 22 8, 22 14 C22 8, 30 12, 30 18 C30 24, 22 28, 22 22 C22 28, 14 24, 14 18Z" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
      <circle cx="22" cy="18" r="3" fill="#7c3aed" opacity="0.4"/>
    </g>

    <text x="484" y="276" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="700">AI Interprets</text>
    <text x="484" y="298" text-anchor="middle" fill="#64748b" font-size="12">Extracts material, size,</text>
    <text x="484" y="314" text-anchor="middle" fill="#64748b" font-size="12">application, and context</text>

    <rect x="388" y="332" width="192" height="28" rx="6" fill="#faf5ff"/>
    <text x="484" y="350" text-anchor="middle" fill="#6d28d9" font-size="11">brass + fitting + water heater</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(612, 238)">
    <rect x="0" y="0" width="60" height="24" rx="12" fill="#c7d2fe"/>
    <text x="30" y="17" text-anchor="middle" fill="#6366f1" font-size="18" font-weight="700">&#x2192;</text>
  </g>

  <!-- Step 3: Catalog Searched -->
  <g filter="url(#stepShadow)">
    <rect x="680" y="120" width="240" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="680" y="120" width="240" height="8" rx="4" fill="#a5b4fc"/>

    <circle cx="800" cy="168" r="22" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="800" y="175" text-anchor="middle" fill="#4f46e5" font-size="18" font-weight="800">3</text>

    <!-- Database icon -->
    <g transform="translate(778, 202)">
      <ellipse cx="22" cy="6" rx="20" ry="6" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/>
      <path d="M2 6 L2 30 C2 33, 42 33, 42 30 L42 6" fill="none" stroke="#818cf8" stroke-width="1.5"/>
      <ellipse cx="22" cy="18" rx="20" ry="4" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.5"/>
      <ellipse cx="22" cy="30" rx="20" ry="6" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    </g>

    <text x="800" y="276" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="700">Catalog Searched</text>
    <text x="800" y="298" text-anchor="middle" fill="#64748b" font-size="12">Your SKUs, pricing,</text>
    <text x="800" y="314" text-anchor="middle" fill="#64748b" font-size="12">inventory, and cross-refs</text>

    <rect x="704" y="332" width="192" height="28" rx="6" fill="#eef2ff"/>
    <text x="800" y="350" text-anchor="middle" fill="#4338ca" font-size="11">250K+ SKUs scanned in ms</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(928, 238)">
    <rect x="0" y="0" width="60" height="24" rx="12" fill="#a5b4fc"/>
    <text x="30" y="17" text-anchor="middle" fill="#4f46e5" font-size="18" font-weight="700">&#x2192;</text>
  </g>

  <!-- Step 4: Right Part Found -->
  <g filter="url(#stepShadow)">
    <rect x="996" y="120" width="162" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="996" y="120" width="162" height="8" rx="4" fill="#6366f1"/>

    <circle cx="1077" cy="168" r="22" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="1077" y="175" text-anchor="middle" fill="#16a34a" font-size="18" font-weight="800">4</text>

    <!-- Checkmark icon -->
    <g transform="translate(1055, 202)">
      <circle cx="22" cy="18" r="18" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
      <polyline points="12,18 19,25 32,12" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="1077" y="276" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="700">Right Part</text>
    <text x="1077" y="294" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="700">Found</text>
    <text x="1077" y="316" text-anchor="middle" fill="#64748b" font-size="12">Verified SKU with</text>
    <text x="1077" y="332" text-anchor="middle" fill="#64748b" font-size="12">alternatives</text>

    <rect x="1012" y="348" width="130" height="24" rx="6" fill="#f0fdf4"/>
    <text x="1077" y="364" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">SB-2401 - $12.85</text>
  </g>

  <!-- Bottom time indicator -->
  <rect x="400" y="420" width="400" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="460" y="447" fill="#1e293b" font-size="14" font-weight="600">Average time: 2-3 seconds</text>
  <text x="700" y="447" fill="#64748b" font-size="12">vs 5-15 min manual lookup</text>
</svg>