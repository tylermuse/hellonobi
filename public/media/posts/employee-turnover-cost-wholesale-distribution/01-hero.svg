<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="receiptShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- Left side: context text -->
  <g transform="translate(80, 80)">
    <text x="0" y="0" fill="#f59e0b" font-size="12" font-weight="700" letter-spacing="1">THE HIDDEN COST</text>
    <text x="0" y="40" fill="#1e293b" font-size="32" font-weight="800">What One Employee</text>
    <text x="0" y="78" fill="#1e293b" font-size="32" font-weight="800">Departure Really</text>
    <text x="0" y="116" fill="#1e293b" font-size="32" font-weight="800">Costs You</text>

    <text x="0" y="160" fill="#64748b" font-size="14">Most distributors track onboarding costs.</text>
    <text x="0" y="180" fill="#64748b" font-size="14">Almost none track the full impact.</text>

    <!-- Key stat callout -->
    <rect x="0" y="216" width="380" height="72" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="0" y="216" width="6" height="72" rx="3" fill="#f59e0b"/>
    <text x="28" y="248" fill="#1e293b" font-size="14" font-weight="600">Average distribution employee tenure</text>
    <text x="28" y="272" fill="#f59e0b" font-size="22" font-weight="800">2.8 years</text>
    <text x="170" y="272" fill="#64748b" font-size="13">(down from 4.2 in 2019)</text>

    <rect x="0" y="308" width="380" height="72" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="0" y="308" width="6" height="72" rx="3" fill="#f59e0b"/>
    <text x="28" y="340" fill="#1e293b" font-size="14" font-weight="600">Annual turnover rate in wholesale</text>
    <text x="28" y="364" fill="#f59e0b" font-size="22" font-weight="800">25-35%</text>
    <text x="162" y="364" fill="#64748b" font-size="13">of frontline staff</text>
  </g>

  <!-- Right side: Receipt/invoice card -->
  <g filter="url(#receiptShadow)" transform="translate(580, 30)">
    <rect x="0" y="0" width="520" height="440" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Receipt header -->
    <rect x="0" y="0" width="520" height="60" rx="16" fill="#fffbeb"/>
    <rect x="0" y="44" width="520" height="16" fill="#fffbeb"/>
    <text x="260" y="30" text-anchor="middle" fill="#1e293b" font-size="18" font-weight="800">COST OF TURNOVER</text>
    <text x="260" y="50" text-anchor="middle" fill="#92400e" font-size="11" font-weight="500">Per employee departure in wholesale distribution</text>

    <!-- Separator -->
    <line x1="30" y1="74" x2="490" y2="74" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Line item 1 -->
    <rect x="24" y="88" width="472" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="44" y="112" fill="#1e293b" font-size="14" font-weight="600">Direct Onboarding Costs</text>
    <text x="44" y="130" fill="#64748b" font-size="11">Recruiting, HR processing, initial training materials</text>
    <text x="476" y="116" text-anchor="end" fill="#1e293b" font-size="18" font-weight="700">$4,100</text>

    <!-- Line item 2 -->
    <rect x="24" y="152" width="472" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="44" y="176" fill="#1e293b" font-size="14" font-weight="600">Supervisor and Mentor Time</text>
    <text x="44" y="194" fill="#64748b" font-size="11">Senior staff shadowing, Q&amp;A, hands-on coaching</text>
    <text x="476" y="180" text-anchor="end" fill="#1e293b" font-size="18" font-weight="700">$10-19K</text>

    <!-- Line item 3 -->
    <rect x="24" y="216" width="472" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="44" y="240" fill="#1e293b" font-size="14" font-weight="600">Reduced Productivity</text>
    <text x="44" y="258" fill="#64748b" font-size="11">6-12 months before new hire reaches full speed</text>
    <text x="476" y="244" text-anchor="end" fill="#1e293b" font-size="18" font-weight="700">$6-12K</text>

    <!-- Line item 4 -->
    <rect x="24" y="280" width="472" height="52" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="44" y="304" fill="#1e293b" font-size="14" font-weight="600">Error and Rework Costs</text>
    <text x="44" y="322" fill="#64748b" font-size="11">Wrong parts, returns, customer friction during ramp-up</text>
    <text x="476" y="308" text-anchor="end" fill="#1e293b" font-size="18" font-weight="700">$3-8K</text>

    <!-- Dotted separator before total -->
    <line x1="30" y1="350" x2="490" y2="350" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- TOTAL -->
    <text x="44" y="382" fill="#1e293b" font-size="16" font-weight="800">TOTAL COST PER DEPARTURE</text>
    <text x="476" y="382" text-anchor="end" fill="#f59e0b" font-size="28" font-weight="800">$23-45K</text>

    <!-- Footer note -->
    <rect x="24" y="400" width="472" height="28" rx="6" fill="#f1f5f9"/>
    <text x="260" y="419" text-anchor="middle" fill="#64748b" font-size="11">Based on SHRM and industry-specific research</text>
  </g>
</svg>