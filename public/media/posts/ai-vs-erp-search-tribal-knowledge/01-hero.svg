<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="podShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="700">Three Ways to Find a Part -- Compared</text>
  <text x="600" y="66" text-anchor="middle" fill="#64748b" font-size="13">Which method actually works when a customer needs help?</text>

  <!-- Podium base -->
  <rect x="100" y="440" width="1000" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>

  <!-- LEFT CARD: ERP Search (medium height) -->
  <g filter="url(#podShadow)">
    <rect x="120" y="175" width="300" height="265" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="120" y="175" width="300" height="6" rx="3" fill="#f59e0b"/>

    <!-- Rank badge -->
    <circle cx="270" cy="210" r="20" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <text x="270" y="217" text-anchor="middle" fill="#d97706" font-size="16" font-weight="800">2</text>

    <text x="270" y="254" text-anchor="middle" fill="#1e293b" font-size="20" font-weight="800">ERP Search</text>

    <!-- Stars: 2.5 out of 5 -->
    <g transform="translate(195, 266)">
      <text x="0" y="16" fill="#f59e0b" font-size="18">&#x2605;&#x2605;</text>
      <text x="38" y="16" fill="#f59e0b" font-size="18">&#x2BEA;</text>
      <text x="57" y="16" fill="#e2e8f0" font-size="18">&#x2605;&#x2605;</text>
    </g>

    <!-- Attributes -->
    <line x1="148" y1="298" x2="392" y2="298" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(148, 312)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#fde68a"/>
      <text x="16" y="9" fill="#475569" font-size="12">Keyword-based matching</text>
      <rect x="0" y="24" width="8" height="8" rx="2" fill="#fde68a"/>
      <text x="16" y="33" fill="#475569" font-size="12">Full catalog coverage</text>
      <rect x="0" y="48" width="8" height="8" rx="2" fill="#fecaca"/>
      <text x="16" y="57" fill="#475569" font-size="12">Requires exact terms</text>
      <rect x="0" y="72" width="8" height="8" rx="2" fill="#fecaca"/>
      <text x="16" y="81" fill="#475569" font-size="12">Too many irrelevant results</text>
    </g>

    <rect x="160" y="412" width="180" height="28" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="250" y="430" text-anchor="middle" fill="#d97706" font-size="11" font-weight="600">Good for exact lookups</text>
  </g>

  <!-- CENTER CARD: AI Copilot (tallest, winner) -->
  <g filter="url(#podShadow)">
    <rect x="450" y="90" width="300" height="350" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="450" y="90" width="300" height="6" rx="3" fill="#3b82f6"/>

    <!-- Winner crown / badge -->
    <rect x="538" y="108" width="124" height="28" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="600" y="127" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="700">BEST OVERALL</text>

    <!-- Rank badge -->
    <circle cx="600" cy="170" r="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="600" y="178" text-anchor="middle" fill="#3b82f6" font-size="20" font-weight="800">1</text>

    <text x="600" y="218" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="800">AI Copilot</text>

    <!-- Stars: 5 out of 5 -->
    <g transform="translate(518, 230)">
      <text x="0" y="16" fill="#3b82f6" font-size="20">&#x2605;&#x2605;&#x2605;&#x2605;&#x2605;</text>
    </g>

    <!-- Attributes -->
    <line x1="478" y1="260" x2="722" y2="260" stroke="#eff6ff" stroke-width="1"/>
    <g transform="translate(478, 274)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#86efac"/>
      <text x="16" y="9" fill="#475569" font-size="12">Understands natural language</text>
      <rect x="0" y="24" width="8" height="8" rx="2" fill="#86efac"/>
      <text x="16" y="33" fill="#475569" font-size="12">Cross-references manufacturers</text>
      <rect x="0" y="48" width="8" height="8" rx="2" fill="#86efac"/>
      <text x="16" y="57" fill="#475569" font-size="12">Available 24/7, always consistent</text>
      <rect x="0" y="72" width="8" height="8" rx="2" fill="#86efac"/>
      <text x="16" y="81" fill="#475569" font-size="12">Scales with your team</text>
      <rect x="0" y="96" width="8" height="8" rx="2" fill="#86efac"/>
      <text x="16" y="105" fill="#475569" font-size="12">Learns from your catalog data</text>
    </g>

    <rect x="490" y="404" width="220" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="600" y="424" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="600">Best for every scenario</text>
  </g>

  <!-- RIGHT CARD: Tribal Knowledge (shortest) -->
  <g filter="url(#podShadow)">
    <rect x="780" y="225" width="300" height="215" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="780" y="225" width="300" height="6" rx="3" fill="#94a3b8"/>

    <!-- Rank badge -->
    <circle cx="930" cy="260" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="930" y="267" text-anchor="middle" fill="#64748b" font-size="16" font-weight="800">3</text>

    <text x="930" y="302" text-anchor="middle" fill="#1e293b" font-size="20" font-weight="800">Tribal Knowledge</text>

    <!-- Stars: variable -->
    <g transform="translate(852, 314)">
      <text x="0" y="16" fill="#94a3b8" font-size="18">&#x2605;&#x2605;</text>
      <text x="38" y="16" fill="#e2e8f0" font-size="18">&#x2605;&#x2605;&#x2605;</text>
    </g>
    <text x="930" y="348" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">(varies by who is working)</text>

    <!-- Attributes -->
    <line x1="808" y1="358" x2="1052" y2="358" stroke="#f1f5f9" stroke-width="1"/>
    <g transform="translate(808, 372)">
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#86efac"/>
      <text x="16" y="9" fill="#475569" font-size="12">Deep product intuition</text>
      <rect x="0" y="24" width="8" height="8" rx="2" fill="#fecaca"/>
      <text x="16" y="33" fill="#475569" font-size="12">Walks out the door at 5pm</text>
    </g>

    <rect x="820" y="412" width="220" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="930" y="430" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">Unreliable and unscalable</text>
  </g>
</svg>