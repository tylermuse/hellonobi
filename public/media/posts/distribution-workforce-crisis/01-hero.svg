<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">The Distribution Workforce Crisis</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#64748b">Four metrics that define the urgency</text>

  <!-- Card 1 - Red top -->
  <rect x="60" y="100" width="250" height="340" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="60" y="100" width="250" height="6" rx="3" fill="#ef4444"/>
  <text x="185" y="195" text-anchor="middle" font-size="64" fill="#ef4444" font-weight="800">25%</text>
  <line x1="110" y1="215" x2="260" y2="215" stroke="#fecaca" stroke-width="1"/>
  <text x="185" y="245" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">of workforce</text>
  <text x="185" y="268" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">age 55+</text>
  <text x="185" y="310" text-anchor="middle" font-size="12" fill="#64748b">Retirement-eligible workers</text>
  <text x="185" y="328" text-anchor="middle" font-size="12" fill="#64748b">taking decades of product</text>
  <text x="185" y="346" text-anchor="middle" font-size="12" fill="#64748b">knowledge with them</text>
  <!-- Warning icon -->
  <circle cx="185" cy="400" r="22" fill="#fef2f2"/>
  <text x="185" y="408" text-anchor="middle" font-size="22" fill="#ef4444" font-weight="700">!</text>

  <!-- Card 2 - Amber top -->
  <rect x="340" y="100" width="250" height="340" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="340" y="100" width="250" height="6" rx="3" fill="#f59e0b"/>
  <text x="465" y="195" text-anchor="middle" font-size="56" fill="#d97706" font-weight="800">26.7%</text>
  <line x1="390" y1="215" x2="540" y2="215" stroke="#fde68a" stroke-width="1"/>
  <text x="465" y="245" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">annual</text>
  <text x="465" y="268" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">turnover rate</text>
  <text x="465" y="310" text-anchor="middle" font-size="12" fill="#64748b">More than 1 in 4 employees</text>
  <text x="465" y="328" text-anchor="middle" font-size="12" fill="#64748b">leave every year, creating</text>
  <text x="465" y="346" text-anchor="middle" font-size="12" fill="#64748b">constant training cycles</text>
  <circle cx="465" cy="400" r="22" fill="#fffbeb"/>
  <path d="M457 395 L465 385 L473 395 Z M462 398 L462 406 L468 406 L468 398 Z" fill="#f59e0b"/>

  <!-- Card 3 - Coral top -->
  <rect x="620" y="100" width="250" height="340" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="620" y="100" width="250" height="6" rx="3" fill="#f97316"/>
  <text x="745" y="195" text-anchor="middle" font-size="64" fill="#ea580c" font-weight="800">2.1M</text>
  <line x1="670" y1="215" x2="820" y2="215" stroke="#fed7aa" stroke-width="1"/>
  <text x="745" y="245" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">unfilled jobs</text>
  <text x="745" y="268" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">by 2030</text>
  <text x="745" y="310" text-anchor="middle" font-size="12" fill="#64748b">Manufacturing sector projected</text>
  <text x="745" y="328" text-anchor="middle" font-size="12" fill="#64748b">shortfall will cascade into</text>
  <text x="745" y="346" text-anchor="middle" font-size="12" fill="#64748b">distribution operations</text>
  <circle cx="745" cy="400" r="22" fill="#fff7ed"/>
  <text x="745" y="407" text-anchor="middle" font-size="18" fill="#ea580c" font-weight="700">M</text>

  <!-- Card 4 - Orange top -->
  <rect x="900" y="100" width="250" height="340" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="900" y="100" width="250" height="6" rx="3" fill="#fb923c"/>
  <text x="1025" y="185" text-anchor="middle" font-size="18" fill="#9a3412" font-weight="600">$</text>
  <text x="1025" y="195" text-anchor="middle" font-size="56" fill="#c2410c" font-weight="800">4,100</text>
  <line x1="950" y1="215" x2="1100" y2="215" stroke="#fdba74" stroke-width="1"/>
  <text x="1025" y="245" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">average</text>
  <text x="1025" y="268" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">onboarding cost</text>
  <text x="1025" y="310" text-anchor="middle" font-size="12" fill="#64748b">Just the direct cost before</text>
  <text x="1025" y="328" text-anchor="middle" font-size="12" fill="#64748b">accounting for lost productivity</text>
  <text x="1025" y="346" text-anchor="middle" font-size="12" fill="#64748b">and supervisor time</text>
  <circle cx="1025" cy="400" r="22" fill="#fff7ed"/>
  <text x="1025" y="408" text-anchor="middle" font-size="20" fill="#c2410c" font-weight="700">$</text>

  <!-- Source -->
  <text x="600" y="475" text-anchor="middle" font-size="10" fill="#94a3b8">Sources: Bureau of Labor Statistics, SHRM, Deloitte Manufacturing Skills Gap Study</text>
</svg>