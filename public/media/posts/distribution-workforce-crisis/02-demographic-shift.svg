<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" fill="#1e293b" font-weight="700">Distribution Workforce Age Distribution</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#64748b">The retirement wave is already here</text>

  <!-- Y axis labels and gridlines -->
  <text x="130" y="118" text-anchor="end" font-size="13" fill="#475569" font-weight="500">65+</text>
  <text x="130" y="178" text-anchor="end" font-size="13" fill="#475569" font-weight="500">55-64</text>
  <text x="130" y="238" text-anchor="end" font-size="13" fill="#475569" font-weight="500">45-54</text>
  <text x="130" y="298" text-anchor="end" font-size="13" fill="#475569" font-weight="500">35-44</text>
  <text x="130" y="358" text-anchor="end" font-size="13" fill="#475569" font-weight="500">25-34</text>
  <text x="130" y="418" text-anchor="end" font-size="13" fill="#475569" font-weight="500">Under 25</text>

  <!-- Horizontal gridlines -->
  <line x1="145" y1="110" x2="880" y2="110" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="145" y1="170" x2="880" y2="170" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="145" y1="230" x2="880" y2="230" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="145" y1="290" x2="880" y2="290" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="145" y1="350" x2="880" y2="350" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="145" y1="410" x2="880" y2="410" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Bars -->
  <!-- 65+ (medium, DARK RED) - 8% -->
  <rect x="145" y="100" width="200" height="36" rx="4" fill="#991b1b"/>
  <text x="355" y="123" font-size="13" fill="#991b1b" font-weight="700">8%</text>
  <rect x="375" y="106" width="82" height="24" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="416" y="123" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="700">RETIRED</text>

  <!-- 55-64 (long, RED) - 17% -->
  <rect x="145" y="160" width="430" height="36" rx="4" fill="#dc2626"/>
  <text x="585" y="183" font-size="13" fill="#dc2626" font-weight="700">17%</text>
  <rect x="605" y="166" width="90" height="24" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="650" y="183" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">RETIRING</text>

  <!-- 45-54 (long, blue) - 22% -->
  <rect x="145" y="220" width="550" height="36" rx="4" fill="#3b82f6"/>
  <text x="705" y="243" font-size="13" fill="#3b82f6" font-weight="700">22%</text>

  <!-- 35-44 (medium-long, blue) - 24% -->
  <rect x="145" y="280" width="600" height="36" rx="4" fill="#60a5fa"/>
  <text x="755" y="303" font-size="13" fill="#3b82f6" font-weight="700">24%</text>

  <!-- 25-34 (medium, blue) - 20% -->
  <rect x="145" y="340" width="500" height="36" rx="4" fill="#93c5fd"/>
  <text x="655" y="363" font-size="13" fill="#3b82f6" font-weight="700">20%</text>

  <!-- Under 25 (short, blue) - 9% -->
  <rect x="145" y="400" width="225" height="36" rx="4" fill="#bfdbfe"/>
  <text x="380" y="423" font-size="13" fill="#3b82f6" font-weight="700">9%</text>

  <!-- Right side annotation box -->
  <rect x="910" y="100" width="260" height="120" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="1040" y="132" text-anchor="middle" font-size="42" fill="#dc2626" font-weight="800">25%</text>
  <text x="1040" y="155" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">retirement eligible</text>
  <line x1="970" y1="168" x2="1110" y2="168" stroke="#fecaca" stroke-width="1"/>
  <text x="1040" y="188" text-anchor="middle" font-size="11" fill="#64748b">Taking decades of product</text>
  <text x="1040" y="204" text-anchor="middle" font-size="11" fill="#64748b">knowledge with them</text>

  <!-- Connector line from annotation to bars -->
  <line x1="910" y1="160" x2="700" y2="140" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="910" y1="160" x2="700" y2="180" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottom annotation -->
  <rect x="910" y="260" width="260" height="90" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1040" y="290" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">The Pipeline Problem</text>
  <text x="1040" y="312" text-anchor="middle" font-size="11" fill="#64748b">Only 9% of workers are under</text>
  <text x="1040" y="328" text-anchor="middle" font-size="11" fill="#64748b">25 -- not enough to replace retirees</text>

  <!-- Source -->
  <text x="600" y="475" text-anchor="middle" font-size="10" fill="#94a3b8">Source: Bureau of Labor Statistics, Wholesale Trade Industry Data</text>
</svg>