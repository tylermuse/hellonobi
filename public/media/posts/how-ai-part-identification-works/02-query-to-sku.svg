<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="funnelShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">From Raw Text to Verified SKU</text>
  <text x="600" y="62" text-anchor="middle" fill="#64748b" font-size="13">The AI identification pipeline, step by step</text>

  <!-- Layer 1: Raw Text (widest) -->
  <g filter="url(#funnelShadow)">
    <rect x="100" y="80" width="1000" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="100" y="80" width="1000" height="6" rx="3" fill="#93c5fd"/>
    <circle cx="140" cy="120" r="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="140" y="126" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="800">1</text>
    <text x="174" y="112" fill="#1e293b" font-size="15" font-weight="700">Raw Customer Input</text>
    <text x="174" y="132" fill="#64748b" font-size="12">Unstructured natural language as spoken at the counter</text>
    <rect x="720" y="98" width="360" height="34" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="900" y="120" text-anchor="middle" fill="#92400e" font-size="13" font-style="italic">"brass thing for the water heater, 3/4 maybe"</text>
  </g>

  <!-- Arrow down -->
  <text x="600" y="164" text-anchor="middle" fill="#93c5fd" font-size="20">&#x25BC;</text>

  <!-- Layer 2: NLP Extraction -->
  <g filter="url(#funnelShadow)">
    <rect x="150" y="172" width="900" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="150" y="172" width="900" height="6" rx="3" fill="#60a5fa"/>
    <circle cx="190" cy="212" r="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="190" y="218" text-anchor="middle" fill="#2563eb" font-size="14" font-weight="800">2</text>
    <text x="224" y="204" fill="#1e293b" font-size="15" font-weight="700">NLP Entity Extraction</text>
    <text x="224" y="224" fill="#64748b" font-size="12">Identifies material, application, type, and sizing from context</text>

    <g transform="translate(680, 192)">
      <rect x="0" y="0" width="80" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="600">MATERIAL</text>
      <text x="40" y="28" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Brass</text>
      <rect x="88" y="0" width="86" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="131" y="15" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="600">APPLICATION</text>
      <text x="131" y="28" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Water Htr</text>
      <rect x="182" y="0" width="62" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="213" y="15" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="600">TYPE</text>
      <text x="213" y="28" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">Fitting</text>
      <rect x="252" y="0" width="62" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="283" y="15" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="600">SIZE</text>
      <text x="283" y="28" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">3/4"</text>
    </g>
  </g>

  <!-- Arrow down -->
  <text x="600" y="256" text-anchor="middle" fill="#60a5fa" font-size="20">&#x25BC;</text>

  <!-- Layer 3: Semantic Search -->
  <g filter="url(#funnelShadow)">
    <rect x="200" y="264" width="800" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="200" y="264" width="800" height="6" rx="3" fill="#3b82f6"/>
    <circle cx="240" cy="304" r="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="240" y="310" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="800">3</text>
    <text x="274" y="296" fill="#1e293b" font-size="15" font-weight="700">Semantic Search</text>
    <text x="274" y="316" fill="#64748b" font-size="12">Matches concepts, not just keywords -- understands "fitting" = adapter, coupling, connector</text>
    <rect x="830" y="284" width="148" height="32" rx="8" fill="#eff6ff"/>
    <text x="904" y="305" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="600">12 candidates found</text>
  </g>

  <!-- Arrow down -->
  <text x="600" y="348" text-anchor="middle" fill="#3b82f6" font-size="20">&#x25BC;</text>

  <!-- Layer 4: Ranked Results -->
  <g filter="url(#funnelShadow)">
    <rect x="260" y="356" width="680" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="260" y="356" width="680" height="6" rx="3" fill="#2563eb"/>
    <circle cx="300" cy="396" r="16" fill="#c7d2fe" stroke="#818cf8" stroke-width="1.5"/>
    <text x="300" y="402" text-anchor="middle" fill="#4338ca" font-size="14" font-weight="800">4</text>
    <text x="334" y="388" fill="#1e293b" font-size="15" font-weight="700">Relevance Ranking</text>
    <text x="334" y="408" fill="#64748b" font-size="12">Scores by material match, application fit, size compatibility, stock status</text>
    <rect x="800" y="376" width="118" height="32" rx="8" fill="#eef2ff"/>
    <text x="859" y="397" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="600">Top 3 ranked</text>
  </g>

  <!-- Arrow down -->
  <text x="600" y="440" text-anchor="middle" fill="#2563eb" font-size="20">&#x25BC;</text>

  <!-- Layer 5: Final SKU (narrowest) -->
  <g filter="url(#funnelShadow)">
    <rect x="340" y="448" width="520" height="44" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="340" y="448" width="520" height="4" rx="2" fill="#16a34a"/>
    <circle cx="376" cy="472" r="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="376" y="477" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="800">5</text>
    <text x="402" y="476" fill="#1e293b" font-size="14" font-weight="700">SKU: SB-2401</text>
    <text x="540" y="476" fill="#475569" font-size="12">SharkBite 3/4" Brass Adapter</text>
    <rect x="730" y="460" width="56" height="24" rx="12" fill="#dcfce7"/>
    <text x="758" y="477" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="700">$12.85</text>
    <rect x="794" y="460" width="48" height="24" rx="12" fill="#dcfce7"/>
    <text x="818" y="477" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="700">98%</text>
  </g>
</svg>