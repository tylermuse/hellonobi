<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- White background -->
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Time Per Part Lookup by Method</text>
  <text x="600" y="70" text-anchor="middle" font-size="13" fill="#64748b">Average time per part lookup across different approaches</text>

  <!-- Gridlines -->
  <line x1="280" y1="100" x2="280" y2="420" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="440" y1="100" x2="440" y2="420" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="600" y1="100" x2="600" y2="420" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="760" y1="100" x2="760" y2="420" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="920" y1="100" x2="920" y2="420" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="1080" y1="100" x2="1080" y2="420" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Grid labels -->
  <text x="280" y="445" text-anchor="middle" font-size="10" fill="#94a3b8">0</text>
  <text x="440" y="445" text-anchor="middle" font-size="10" fill="#94a3b8">3 min</text>
  <text x="600" y="445" text-anchor="middle" font-size="10" fill="#94a3b8">6 min</text>
  <text x="760" y="445" text-anchor="middle" font-size="10" fill="#94a3b8">9 min</text>
  <text x="920" y="445" text-anchor="middle" font-size="10" fill="#94a3b8">12 min</text>
  <text x="1080" y="445" text-anchor="middle" font-size="10" fill="#94a3b8">15 min</text>

  <!-- Axis line -->
  <line x1="280" y1="420" x2="1100" y2="420" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bar 1: Manufacturer Call - 15 min -->
  <text x="270" y="148" text-anchor="end" font-size="13" font-weight="500" fill="#1e293b">Manufacturer Call</text>
  <rect x="280" y="128" width="800" height="48" rx="4" fill="#991b1b"/>
  <rect x="280" y="128" width="800" height="24" rx="4" fill="#b91c1c" opacity="0.4"/>
  <text x="1090" y="158" text-anchor="start" font-size="14" font-weight="700" fill="#991b1b">15 min</text>

  <!-- Bar 2: Manual Catalog - 8 min -->
  <text x="270" y="228" text-anchor="end" font-size="13" font-weight="500" fill="#1e293b">Manual Catalog</text>
  <rect x="280" y="208" width="427" height="48" rx="4" fill="#dc2626"/>
  <rect x="280" y="208" width="427" height="24" rx="4" fill="#ef4444" opacity="0.4"/>
  <text x="717" y="238" text-anchor="start" font-size="14" font-weight="700" fill="#dc2626">8 min</text>

  <!-- Bar 3: ERP Keyword - 3.5 min -->
  <text x="270" y="308" text-anchor="end" font-size="13" font-weight="500" fill="#1e293b">ERP Keyword</text>
  <rect x="280" y="288" width="187" height="48" rx="4" fill="#d97706"/>
  <rect x="280" y="288" width="187" height="24" rx="4" fill="#f59e0b" opacity="0.4"/>
  <text x="477" y="318" text-anchor="start" font-size="14" font-weight="700" fill="#d97706">3.5 min</text>

  <!-- Bar 4: AI Copilot - 20 sec -->
  <text x="270" y="388" text-anchor="end" font-size="13" font-weight="500" fill="#1e293b">AI Copilot</text>
  <rect x="280" y="368" width="18" height="48" rx="4" fill="#16a34a"/>
  <rect x="280" y="368" width="18" height="24" rx="4" fill="#22c55e" opacity="0.4"/>
  <text x="308" y="398" text-anchor="start" font-size="14" font-weight="700" fill="#16a34a">20 sec</text>

  <!-- 45x faster annotation -->
  <line x1="298" y1="368" x2="298" y2="178" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="305" y="185" width="120" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="365" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">45x faster</text>

  <!-- Bottom accent -->
  <rect x="0" y="492" width="1200" height="8" fill="#2563eb" opacity="0.06"/>
</svg>