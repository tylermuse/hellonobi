<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Light gray background -->
  <rect width="1200" height="500" fill="#f8fafc"/>

  <!-- Clipboard shape -->
  <rect x="300" y="30" width="600" height="450" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Clipboard clip -->
  <rect x="510" y="18" width="180" height="30" rx="15" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="600" cy="33" r="6" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="340" y="60" width="520" height="50" rx="8" fill="#4f46e5"/>
  <text x="600" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">AI Evaluation Scorecard</text>

  <!-- Column headers -->
  <text x="370" y="140" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1">CRITERION</text>
  <text x="760" y="140" text-anchor="end" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1">IMPORTANCE</text>

  <line x1="340" y1="150" x2="860" y2="150" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1: Catalog Integration - 5 dots -->
  <rect x="345" y="160" width="18" height="18" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="345" y="174" font-size="12" font-weight="700" fill="#4f46e5">&#10003;</text>
  <text x="378" y="175" font-size="13" font-weight="500" fill="#1e293b">Catalog Integration</text>
  <circle cx="710" cy="170" r="5" fill="#4f46e5"/><circle cx="726" cy="170" r="5" fill="#4f46e5"/><circle cx="742" cy="170" r="5" fill="#4f46e5"/><circle cx="758" cy="170" r="5" fill="#4f46e5"/><circle cx="774" cy="170" r="5" fill="#4f46e5"/>
  <text x="800" y="175" font-size="11" font-weight="600" fill="#4f46e5">Critical</text>

  <line x1="340" y1="190" x2="860" y2="190" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 2: Trade Language Understanding - 5 dots -->
  <rect x="345" y="200" width="18" height="18" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="345" y="214" font-size="12" font-weight="700" fill="#4f46e5">&#10003;</text>
  <text x="378" y="215" font-size="13" font-weight="500" fill="#1e293b">Trade Language Understanding</text>
  <circle cx="710" cy="210" r="5" fill="#4f46e5"/><circle cx="726" cy="210" r="5" fill="#4f46e5"/><circle cx="742" cy="210" r="5" fill="#4f46e5"/><circle cx="758" cy="210" r="5" fill="#4f46e5"/><circle cx="774" cy="210" r="5" fill="#4f46e5"/>
  <text x="800" y="215" font-size="11" font-weight="600" fill="#4f46e5">Critical</text>

  <line x1="340" y1="230" x2="860" y2="230" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 3: Cross-Referencing - 4 dots -->
  <rect x="345" y="240" width="18" height="18" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="345" y="254" font-size="12" font-weight="700" fill="#4f46e5">&#10003;</text>
  <text x="378" y="255" font-size="13" font-weight="500" fill="#1e293b">Cross-Referencing Capability</text>
  <circle cx="710" cy="250" r="5" fill="#4f46e5"/><circle cx="726" cy="250" r="5" fill="#4f46e5"/><circle cx="742" cy="250" r="5" fill="#4f46e5"/><circle cx="758" cy="250" r="5" fill="#4f46e5"/><circle cx="774" cy="250" r="5" fill="#e2e8f0"/>
  <text x="800" y="255" font-size="11" font-weight="600" fill="#6366f1">High</text>

  <line x1="340" y1="270" x2="860" y2="270" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 4: ERP Compatibility - 4 dots -->
  <rect x="345" y="280" width="18" height="18" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="345" y="294" font-size="12" font-weight="700" fill="#4f46e5">&#10003;</text>
  <text x="378" y="295" font-size="13" font-weight="500" fill="#1e293b">ERP Compatibility</text>
  <circle cx="710" cy="290" r="5" fill="#4f46e5"/><circle cx="726" cy="290" r="5" fill="#4f46e5"/><circle cx="742" cy="290" r="5" fill="#4f46e5"/><circle cx="758" cy="290" r="5" fill="#4f46e5"/><circle cx="774" cy="290" r="5" fill="#e2e8f0"/>
  <text x="800" y="295" font-size="11" font-weight="600" fill="#6366f1">High</text>

  <line x1="340" y1="310" x2="860" y2="310" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 5: Security & Compliance - 4 dots -->
  <rect x="345" y="320" width="18" height="18" rx="3" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="345" y="334" font-size="12" font-weight="700" fill="#4f46e5">&#10003;</text>
  <text x="378" y="335" font-size="13" font-weight="500" fill="#1e293b">Security &amp; Compliance</text>
  <circle cx="710" cy="330" r="5" fill="#4f46e5"/><circle cx="726" cy="330" r="5" fill="#4f46e5"/><circle cx="742" cy="330" r="5" fill="#4f46e5"/><circle cx="758" cy="330" r="5" fill="#4f46e5"/><circle cx="774" cy="330" r="5" fill="#e2e8f0"/>
  <text x="800" y="335" font-size="11" font-weight="600" fill="#6366f1">High</text>

  <line x1="340" y1="350" x2="860" y2="350" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 6: Deployment Speed - 3 dots -->
  <rect x="345" y="360" width="18" height="18" rx="3" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="378" y="375" font-size="13" font-weight="500" fill="#1e293b">Deployment Speed</text>
  <circle cx="710" cy="370" r="5" fill="#4f46e5"/><circle cx="726" cy="370" r="5" fill="#4f46e5"/><circle cx="742" cy="370" r="5" fill="#4f46e5"/><circle cx="758" cy="370" r="5" fill="#e2e8f0"/><circle cx="774" cy="370" r="5" fill="#e2e8f0"/>
  <text x="800" y="375" font-size="11" font-weight="600" fill="#818cf8">Medium</text>

  <line x1="340" y1="390" x2="860" y2="390" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 7: ROI Measurement - 3 dots -->
  <rect x="345" y="400" width="18" height="18" rx="3" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="378" y="415" font-size="13" font-weight="500" fill="#1e293b">ROI Measurement</text>
  <circle cx="710" cy="410" r="5" fill="#4f46e5"/><circle cx="726" cy="410" r="5" fill="#4f46e5"/><circle cx="742" cy="410" r="5" fill="#4f46e5"/><circle cx="758" cy="410" r="5" fill="#e2e8f0"/><circle cx="774" cy="410" r="5" fill="#e2e8f0"/>
  <text x="800" y="415" font-size="11" font-weight="600" fill="#818cf8">Medium</text>

  <!-- Footer -->
  <text x="600" y="470" text-anchor="middle" font-size="11" fill="#94a3b8">Use this scorecard to evaluate any AI tool before purchasing</text>
</svg>